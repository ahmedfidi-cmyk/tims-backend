<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dual-Engine Enterprise</title>
<meta name="description" content="A bilingual executive portfolio for a dual-engine enterprise automation platform: an Operational Engine and an Executive Command Room.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#14102A; --ground2:#1C1640; --panel:#211A4A; --panel2:#2B1F4D; --raise:#3E2C6E;
  --action:#3E2C6E; --action2:#5A47A0;
  --line:rgba(251,250,247,.14); --line2:rgba(251,250,247,.07);
  --ink:#FBFAF7; --ink2:rgba(244,242,236,.76); --ink3:rgba(244,242,236,.52); --ink4:rgba(244,242,236,.34);
  --gold:#E2B75A; --gold2:#F2D9A4; --goldsoft:rgba(226,183,90,.15);
  --lav:#B7A9F0; --lavsoft:rgba(90,71,160,.30);
  --amber:#EBA63F; --ambersoft:rgba(235,166,63,.15);
  --red:#E4604F; --redsoft:rgba(228,96,79,.15);
  --font:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ground); color:var(--ink); font-family:var(--font);
  overflow:hidden; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
body.is-print{overflow:visible}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:
  radial-gradient(1400px 900px at 78% -12%, #3E2C6E 0%, transparent 62%),
  radial-gradient(1100px 800px at 8% 108%, #2B1F4D 0%, transparent 60%),
  var(--ground);}
#deck{width:1920px;height:1080px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center center}
.slide{position:absolute;inset:0;width:1920px;height:1080px;opacity:0;visibility:hidden;
  transition:opacity .42s ease, transform .42s ease; transform:translateY(14px) scale(.995);
  padding:104px 120px 120px; display:flex; flex-direction:column; overflow:hidden;}
.slide.is-on{opacity:1;visibility:visible;transform:none}
.slide::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.022) 0%,transparent 26%)}

/* ---------- type ---------- */
.eyebrow{display:flex;align-items:center;gap:18px;font-size:24px;font-weight:600;color:var(--gold);letter-spacing:.01em}
.eyebrow i{display:block;width:56px;height:2px;background:var(--gold);flex:none}
h1{font-size:122px;font-weight:600;line-height:1.02;letter-spacing:-.025em;color:#fff}
h2{font-size:68px;font-weight:600;line-height:1.14;letter-spacing:-.018em;color:#fff}
h3{font-size:34px;font-weight:600;line-height:1.3;color:#fff}
.lede{font-size:38px;line-height:1.42;color:var(--ink2);font-weight:400}
.sub{font-size:27px;line-height:1.56;color:var(--ink2)}
.small{font-size:22px;line-height:1.55;color:var(--ink3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.gold{color:var(--gold)} .lav{color:var(--lav)} .amber{color:var(--amber)} .red{color:var(--red)}
.cap{font-size:19px;color:var(--ink4);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
html[dir=rtl] .cap{letter-spacing:0;text-transform:none}

/* ---------- head block ---------- */
.head{display:flex;flex-direction:column;gap:20px;flex:none}
.head.wide{max-width:1300px}

/* ---------- footer ---------- */
.foot{position:absolute;inset-inline:120px;bottom:52px;display:flex;justify-content:space-between;align-items:center;
  font-size:20px;color:var(--ink4);border-top:1px solid var(--line2);padding-top:22px}
.foot .mark{display:flex;align-items:center;gap:12px;font-weight:600;letter-spacing:.04em}
.foot .mark b{color:var(--gold);font-weight:700}

/* ---------- primitives ---------- */
.grid{display:grid;gap:26px}
.card{background:linear-gradient(165deg,var(--panel) 0%,var(--ground2) 100%);border:1px solid var(--line);
  border-radius:20px;padding:34px 36px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.card.flat{background:rgba(251,250,247,.035)}
.card .num{font-size:19px;font-weight:700;color:var(--gold);font-family:var(--mono)}
.card h3{font-size:30px}
.card p{font-size:22px;line-height:1.5;color:var(--ink2)}
.rule{height:1px;background:var(--line);border:0}
.pill{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border-radius:999px;
  border:1px solid var(--line);font-size:20px;font-weight:600;color:var(--ink2);background:rgba(251,250,247,.04)}
.pill.g{color:var(--lav);border-color:rgba(183,169,240,.45);background:var(--lavsoft)}
.pill.a{color:var(--amber);border-color:rgba(235,166,63,.4);background:var(--ambersoft)}
.pill.r{color:var(--red);border-color:rgba(228,96,79,.4);background:var(--redsoft)}
.pill.d{color:var(--gold);border-color:rgba(226,183,90,.42);background:var(--goldsoft)}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.dot.live{box-shadow:0 0 0 0 currentColor;animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(183,169,240,.5)}70%{box-shadow:0 0 0 12px rgba(183,169,240,0)}100%{box-shadow:0 0 0 0 rgba(183,169,240,0)}}

/* ---------- mock chrome ---------- */
.mock{background:linear-gradient(180deg,#1E1745 0%,#171134 100%);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;position:relative;box-shadow:0 44px 90px -40px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.02) inset}
.mock .bar{display:flex;align-items:center;gap:16px;padding:16px 22px;border-bottom:1px solid var(--line2);background:rgba(255,255,255,.028)}
.mock .bar .tl{display:flex;gap:8px}
.mock .bar .tl i{width:11px;height:11px;border-radius:50%;background:rgba(251,250,247,.16);display:block}
.mock .bar .ttl{font-size:19px;color:var(--ink2);font-weight:600}
.mock .bar .rt{margin-inline-start:auto;display:flex;gap:12px;align-items:center;font-size:17px;color:var(--ink4)}
.mocklabel{position:absolute;inset-inline-end:16px;bottom:14px;font-size:16px;color:var(--ink4);
  background:rgba(20,16,42,.82);border:1px solid var(--line2);border-radius:999px;padding:6px 14px;backdrop-filter:blur(6px);z-index:3}
.mockcap{font-size:19px;color:var(--ink4);display:flex;align-items:center;gap:10px}

/* app shell inside mock */
.app{display:grid;grid-template-columns:72px 1fr;min-height:0}
.rail{border-inline-end:1px solid var(--line2);padding:18px 0;display:flex;flex-direction:column;align-items:center;gap:16px;background:rgba(255,255,255,.015)}
.rail .ic{width:38px;height:38px;border-radius:11px;background:rgba(251,250,247,.07);display:grid;place-items:center;color:var(--ink3);font-size:17px}
.rail .ic.on{background:var(--goldsoft);color:var(--gold);box-shadow:inset 0 0 0 1px rgba(226,183,90,.35)}
.appmain{padding:22px 26px;display:flex;flex-direction:column;gap:18px;min-width:0}

/* data table */
.tbl{width:100%;border-collapse:collapse;font-size:18px}
.tbl th{font-size:15px;color:var(--ink4);font-weight:600;text-align:start;padding:0 14px 11px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line2);color:var(--ink2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .id{font-family:var(--mono);color:var(--ink);font-size:17px}

/* sla bar */
.sla{height:7px;border-radius:999px;background:rgba(251,250,247,.1);overflow:hidden;min-width:96px}
.sla i{display:block;height:100%;border-radius:999px;background:var(--lav)}
.sla.a i{background:var(--amber)} .sla.r i{background:var(--red)}

/* kpi */
.kpi{background:rgba(251,250,247,.04);border:1px solid var(--line2);border-radius:15px;padding:18px 20px;display:flex;flex-direction:column;gap:7px}
.kpi .k{font-size:15px;color:var(--ink4);font-weight:600}
.kpi .v{font-size:46px;font-weight:600;line-height:1;font-family:var(--mono);letter-spacing:-.02em}
.kpi .n{font-size:15px;color:var(--ink3)}
.kpi.hot{border-color:rgba(228,96,79,.4);background:var(--redsoft)}
.kpi.act{border-color:rgba(226,183,90,.42);background:var(--goldsoft)}

/* stepper */
.steps{display:flex;align-items:flex-start;gap:0;width:100%}
.step{flex:1;display:flex;flex-direction:column;gap:9px;position:relative;padding-top:22px}
.step::before{content:"";position:absolute;top:7px;inset-inline-start:0;width:100%;height:2px;background:rgba(251,250,247,.12)}
.step:first-child::before{inset-inline-start:50%;width:50%}
.step:last-child::before{width:50%}
.step i{position:absolute;top:0;inset-inline-start:calc(50% - 8px);width:16px;height:16px;border-radius:50%;
  background:var(--ground2);box-shadow:inset 0 0 0 2px rgba(251,250,247,.22)}
.step.done::before{background:var(--lav)} .step.done i{background:var(--lav);box-shadow:none}
.step.now i{background:var(--gold);box-shadow:0 0 0 6px rgba(226,183,90,.18)}
.step.late i{background:var(--red);box-shadow:0 0 0 6px rgba(228,96,79,.18)}
.step b{font-size:16px;font-weight:600;color:var(--ink2);text-align:center;line-height:1.3}
.step span{font-size:14px;color:var(--ink4);text-align:center;font-family:var(--mono)}
.step.now b{color:var(--gold)} .step.late b{color:var(--red)} .step.done b{color:var(--ink3)}

/* sector pulse */
.pulse{display:flex;flex-direction:column;gap:13px}
.prow{display:grid;grid-template-columns:118px 1fr 56px;align-items:center;gap:14px;font-size:18px}
.prow .pn{color:var(--ink2);font-weight:600}
.prow .pb{height:9px;border-radius:999px;background:rgba(251,250,247,.08);overflow:hidden}
.prow .pb i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.prow .pv{font-family:var(--mono);color:var(--ink);text-align:end;font-size:19px}

/* lists */
.ticks{display:flex;flex-direction:column;gap:16px}
.ticks li{list-style:none;display:flex;gap:16px;align-items:flex-start;font-size:24px;line-height:1.46;color:var(--ink2)}
.ticks li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none;margin-top:11px}
.ticks.g li::before{background:var(--lav)}
.ticks.r li::before{background:var(--red)}
.ticks li b{color:var(--ink);font-weight:600}

/* ---------- chrome ---------- */
#chrome{position:fixed;inset-inline:0;bottom:0;display:flex;align-items:center;gap:14px;padding:16px 26px;z-index:40;
  pointer-events:none}
#chrome>*{pointer-events:auto}
#chrome{transition:opacity .35s ease}
body.idle #chrome{opacity:0}
body.idle #chrome>*{pointer-events:none}
body.idle{cursor:none}
.btn{appearance:none;border:1px solid var(--line);background:rgba(28,22,64,.86);color:var(--ink2);
  border-radius:11px;height:42px;min-width:42px;padding:0 15px;font-family:var(--font);font-size:17px;font-weight:600;
  cursor:pointer;backdrop-filter:blur(10px);transition:.16s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:rgba(226,183,90,.55);color:var(--gold)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#counter{font-family:var(--mono);font-size:17px;color:var(--ink4);padding:0 6px;min-width:76px;text-align:center}
#bar{position:fixed;inset-inline:0;top:0;height:3px;background:rgba(251,250,247,.07);z-index:41}
#bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0;transition:width .42s ease}
.spacer{flex:1}
html[dir=rtl] .flipx{transform:scaleX(-1)}

/* overview */
#ov{position:fixed;inset:0;z-index:60;background:rgba(14,10,30,.96);backdrop-filter:blur(10px);display:none;
  padding:52px;overflow:auto}
#ov.on{display:block}
#ovg{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:20px;max-width:1500px;margin:0 auto}
.ovc{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:20px;cursor:pointer;
  display:flex;flex-direction:column;gap:9px;transition:.16s;text-align:start}
.ovc:hover{border-color:var(--gold);transform:translateY(-3px)}
.ovc .n{font-family:var(--mono);font-size:15px;color:var(--gold)}
.ovc .t{font-size:20px;font-weight:600;color:var(--ink);line-height:1.3}
.ovc .d{font-size:16px;color:var(--ink4);line-height:1.4}
.ovc[aria-current=true]{border-color:var(--gold);background:var(--raise)}
#ovh{max-width:1500px;margin:0 auto 30px;display:flex;align-items:center;justify-content:space-between}

@media print{
  body,#stage{overflow:visible;background:#14102A}
  #chrome,#bar,#ov{display:none!important}
  #stage{position:static;display:block}
  #deck{position:static;width:auto;height:auto;transform:none}
  .slide{position:relative;opacity:1!important;visibility:visible!important;transform:none!important;
    page-break-after:always;break-after:page;margin:0 auto}
}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="stage"><div id="deck"></div></div>

<nav id="chrome" aria-label="deck controls">
  <button class="btn" id="bOv" title="Overview (O)">▦</button>
  <button class="btn" id="bLang" title="العربية / English">EN</button>
  <div class="spacer"></div>
  <button class="btn" id="bPrev" title="Previous">‹</button>
  <span id="counter" class="mono" dir="ltr">01 / 10</span>
  <button class="btn" id="bNext" title="Next">›</button>
  <div class="spacer"></div>
  <button class="btn" id="bPrint" title="Print / PDF">⎙</button>
  <button class="btn" id="bFull" title="Fullscreen (F)">⤢</button>
</nav>

<div id="ov" role="dialog" aria-modal="true" aria-label="Slide overview">
  <div id="ovh"><h3 id="ovt">Slides</h3><button class="btn" id="bOvX">Esc</button></div>
  <div id="ovg"></div>
</div>
<script>
(function(){
"use strict";
var L = "ar";
function x(ar,en){ return L==="ar" ? ar : en; }
function foot(n,total){
  return '<div class="foot"><div class="mark"><b>◎</b> '+x("محرّكان · مؤسسة واحدة","Two Engines · One Enterprise")+'</div>'+
         '<div class="mono" dir="ltr">'+String(n).padStart(2,"0")+' / '+String(total).padStart(2,"0")+'</div></div>';
}
function emblem(size){
  var s = size||300;
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 300 300" fill="none" aria-hidden="true">'+
  '<defs><radialGradient id="eg" cx="50%" cy="50%" r="50%">'+
  '<stop offset="0%" stop-color="#F2D9A4" stop-opacity=".95"/>'+
  '<stop offset="55%" stop-color="#E2B75A" stop-opacity=".30"/>'+
  '<stop offset="100%" stop-color="#E2B75A" stop-opacity="0"/></radialGradient>'+
  '<linearGradient id="eb" x1="0" y1="0" x2="1" y2="1">'+
  '<stop offset="0%" stop-color="#B7A9F0"/><stop offset="100%" stop-color="#5A47A0"/></linearGradient></defs>'+
  '<circle cx="150" cy="150" r="140" stroke="rgba(251,250,247,.10)" stroke-width="1"/>'+
  '<circle cx="150" cy="150" r="112" stroke="rgba(251,250,247,.07)" stroke-width="1" stroke-dasharray="3 9"/>'+
  '<circle cx="150" cy="150" r="96" fill="url(#eg)"/>'+
  '<circle cx="150" cy="150" r="78" stroke="url(#eb)" stroke-width="7" opacity=".85"/>'+
  '<circle cx="150" cy="150" r="52" stroke="#E2B75A" stroke-width="12"/>'+
  '<circle cx="150" cy="150" r="22" fill="#F2D9A4"/>'+
  '<g stroke="#E9E4FF" stroke-width="9" stroke-linecap="round" opacity=".92">'+
  '<path d="M150 22v44"/><path d="M150 234v44"/><path d="M22 150h44"/><path d="M234 150h44"/></g>'+
  '</svg>';
}

var SLIDES = [];

/* ============ 01 · HERO ============ */
SLIDES.push({
  key:"hero",
  t:{ar:"الافتتاحية",en:"Hero"},
  d:{ar:"الوعد في سطر واحد",en:"The promise in one line"},
  html:function(){
    var chips=[
      [x("عربي وإنجليزي بالكامل","Fully bilingual AR / EN"), x("كل شاشة وكل سير عمل","Every screen, every workflow")],
      [x("تصعيد آلي عند المهلة","Automatic SLA escalation"), x("قبل أن يتأخّر العمل، لا بعده","Before work slips, not after")],
      [x("سجلّ تدقيق متسلسل","Hash-chained audit log"), x("لا يُعدَّل ولا يُحذف","Append-only, tamper-evident")],
      [x("اعتمادات مختومة","Sealed approvals"), x("التوقيع مربوط بنسخة المستند","Signature bound to the exact version")]
    ];
    return ''+
    '<div style="position:absolute;inset-inline-end:-40px;top:90px;opacity:.9">'+emblem(560)+'</div>'+
    '<div style="position:absolute;inset:0;background:radial-gradient(900px 620px at 80% 34%, rgba(226,183,90,.10), transparent 70%)"></div>'+
    '<div class="head" style="position:relative;max-width:1180px;margin-top:10px">'+
      '<div class="eyebrow"><i></i>'+x("منصّة أتمتة مؤسسية · جاهزة للتشغيل","Turnkey enterprise automation platform")+'</div>'+
      '<h1 style="margin-top:26px">'+x("محرّكان.<br>مؤسسة واحدة.<br><span class=\"gold\">رؤية كاملة.</span>","Two Engines.<br>One Enterprise.<br><span class=\"gold\">Total Visibility.</span>")+'</h1>'+
      '<p class="lede" style="margin-top:34px;max-width:980px">'+
        x("محرّك تشغيلي يقود دورة حياة كل طلب في الميدان، وغرفة قيادة تضع المؤسسة كلها أمام الرئيس التنفيذي في شاشة واحدة — على منصّة واحدة، وسجلّ واحد، ومساءلة واحدة.",
          "An Operational Engine that drives every request's lifecycle in the field, and an Executive Command Room that puts the whole enterprise on one screen — one platform, one record, one line of accountability.")+
      '</p>'+
    '</div>'+
    '<div style="margin-top:auto;margin-bottom:40px;position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:22px">'+
      chips.map(function(c){
        return '<div style="border-top:1px solid var(--line);padding-top:20px">'+
          '<div style="font-size:23px;font-weight:600;color:var(--ink)">'+c[0]+'</div>'+
          '<div style="font-size:19px;color:var(--ink4);margin-top:7px;line-height:1.4">'+c[1]+'</div></div>';
      }).join("")+
    '</div>';
  }
});

/* ============ 02 · PROBLEM ============ */
SLIDES.push({
  key:"problem",
  t:{ar:"المشكلة",en:"The problem"},
  d:{ar:"التجزئة التشغيلية وبطء القرار",en:"Operational fragmentation, slow decisions"},
  html:function(){
    var cards=[
      ["01", x("العمل يعيش خارج النظام","Work lives outside the system"),
             x("الطلب يتنقّل بين البريد ومجموعات المحادثة وجداول البيانات. لا توجد نسخة واحدة من الحقيقة، ولا مالك واحد.",
               "A request moves between inboxes, chat groups and spreadsheets. There is no single version of the truth, and no single owner.")],
      ["02", x("التأخير يُكتشف متأخّراً","Delay surfaces too late"),
             x("لا أحد يعرف أن الطلب تجاوز مهلته إلا حين يسأل أحدهم. المتابعة يدوية، والتذكير شخصي.",
               "Nobody knows a request has blown its deadline until someone asks. Follow-up is manual; the reminder is personal.")],
      ["03", x("المساءلة شفهية","Accountability is verbal"),
             x("من استلم؟ متى؟ ولماذا تأخّر؟ الإجابة في ذاكرة الأشخاص لا في سجلّ يمكن الرجوع إليه.",
               "Who received it? When? Why did it stall? The answer sits in people's memory, not in a record anyone can return to.")],
      ["04", x("القيادة ترى الماضي","Leadership sees the past"),
             x("تقرير شهري يصف واقعاً تغيّر قبل أسابيع. القرار يأتي بعد أن يفقد أثره.",
               "A monthly report describes a reality that changed weeks ago. The decision lands after it stops mattering.")]
    ];
    return ''+
    '<div class="head wide">'+
      '<div class="eyebrow"><i></i>'+x("المشكلة","The problem")+'</div>'+
      '<h2>'+x("المؤسسة لا تعاني نقص الجهد.<br>تعاني <span class=\"gold\">تجزئة العمل</span> وتأخّر القرار.",
               "Enterprises do not lack effort.<br>They lack <span class=\"gold\">a connected record</span> — and time.")+'</h2>'+
    '</div>'+
    '<div class="grid" style="grid-template-columns:repeat(4,1fr);margin-top:60px">'+
      cards.map(function(c){

        x("فصل صريح بين المبنيّ والمُخطَّط لحالتك","An explicit split of built against planned for your case"),
        x("تقدير نطاق التهيئة والتشغيل، لا فاتورة مبهمة","A scoped configuration and rollout estimate, not an opaque quote")
      ]]
    ];
    return ''+
    '<div style="position:absolute;inset-inline-end:-190px;top:-190px;opacity:.42">'+emblem(540)+'</div>'+
    '<div style="position:absolute;inset:0;background:radial-gradient(880px 600px at 92% 4%, rgba(226,183,90,.10), transparent 70%)"></div>'+
    '<div class="head wide" style="position:relative">'+
      '<div class="eyebrow"><i></i>'+x("الخطوة التالية","The next step")+'</div>'+
      '<h2 style="font-size:78px;max-width:1420px">'+
        x("خمس وأربعون دقيقة، على طلب واحد من طلباتكم — <span class=gold>وتقرّرون بأنفسكم.</span>",
          "Forty-five minutes, on one of your own request types — <span class=gold>and you decide for yourselves.</span>")+'</h2>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:34px;margin-top:54px;position:relative">'+
      cols.map(function(c,i){
        return '<div style="display:flex;flex-direction:column;gap:18px;'+(i?'border-inline-start:1px solid var(--line);padding-inline-start:34px':'')+'">'+
          '<div class="cap">'+c[0]+'</div>'+
          '<ul class="ticks" style="gap:14px">'+c[1].map(function(t){return '<li style="font-size:22px">'+t+'</li>';}).join("")+'</ul></div>';
      }).join("")+
    '</div>'+
    '<div style="margin-top:auto;margin-bottom:34px;position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:40px">'+
      '<div style="display:flex;flex-direction:column;gap:14px">'+
        '<div style="font-size:40px;font-weight:600;color:#fff;line-height:1.25">'+
          x("احجزوا عرضاً تنفيذياً خاصاً.","Book a private executive demonstration.")+'</div>'+
        '<div style="display:flex;gap:14px;flex-wrap:wrap">'+
          '<span class="pill d" style="font-size:21px;padding:11px 22px">'+x("٤٥ دقيقة · حضورياً أو عن بُعد","45 minutes · in person or remote")+'</span>'+
          '<span class="pill" style="font-size:21px;padding:11px 22px">'+x("باللغة العربية أو الإنجليزية","In Arabic or English")+'</span>'+
          '<span class="pill" style="font-size:21px;padding:11px 22px">'+x("بلا التزام ولا تهيئة مسبقة","No commitment, no prior setup")+'</span>'+
        '</div>'+
      '</div>'+
      '<div style="text-align:end;font-size:19px;color:var(--ink4);line-height:1.7">'+
        x("للتواصل وحجز الموعد","To arrange the session")+'<br>'+
        '<span style="font-size:22px;font-weight:600;color:var(--gold)">[ '+x("البريد وجهة الاتصال","contact e-mail")+' ]</span></div>'+
    '</div>';
  }
});

/* ===================== runtime ===================== */
var deck = document.getElementById("deck"),
    stage = document.getElementById("stage"),
    bar = document.querySelector("#bar i"),
    counter = document.getElementById("counter"),
    ov = document.getElementById("ov"),
    ovg = document.getElementById("ovg"),
    ovt = document.getElementById("ovt"),
    bLang = document.getElementById("bLang"),
    i = 0, N = SLIDES.length;

function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function recall(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

function build(){
  document.documentElement.lang = L;
  document.documentElement.dir = (L === "ar") ? "rtl" : "ltr";
  bLang.textContent = (L === "ar") ? "EN" : "ع";
  bLang.setAttribute("aria-label", L === "ar" ? "Switch to English" : "التحويل إلى العربية");
  ovt.textContent = x("الشرائح","Slides");
  deck.innerHTML = SLIDES.map(function(s,n){
    return '<section class="slide" id="s'+(n+1)+'" aria-label="'+s.t[L]+'" aria-hidden="true">'+
           s.html() + foot(n+1,N) + '</section>';
  }).join("");
  ovg.innerHTML = SLIDES.map(function(s,n){
    return '<button class="ovc" data-go="'+n+'"><span class="n">'+String(n+1).padStart(2,"0")+'</span>'+
           '<span class="t">'+s.t[L]+'</span><span class="d">'+s.d[L]+'</span></button>';
  }).join("");
  Array.prototype.forEach.call(ovg.querySelectorAll("[data-go]"), function(b){
    b.addEventListener("click", function(){ go(+b.dataset.go); closeOv(); });
  });
  show(i, true);
}

function show(n, silent){
  i = Math.max(0, Math.min(N-1, n));
  Array.prototype.forEach.call(deck.children, function(el, k){
    var on = (k === i);
    el.classList.toggle("is-on", on);
    el.setAttribute("aria-hidden", on ? "false" : "true");
  });
  counter.textContent = String(i+1).padStart(2,"0") + " / " + String(N).padStart(2,"0");
  bar.style.width = ((i+1)/N*100) + "%";
  Array.prototype.forEach.call(ovg.children, function(el,k){ el.setAttribute("aria-current", k===i ? "true":"false"); });
  if (!silent) { try { history.replaceState(null,"","#"+(i+1)); } catch(e){} }
}
function go(n){ show(n); try{ history.replaceState(null,"","#"+(i+1)); }catch(e){} }
function next(){ if (i < N-1) go(i+1); }
function prev(){ if (i > 0) go(i-1); }

function fit(){
  var w = window.innerWidth, h = window.innerHeight;
  var s = Math.min(w/1920, h/1080);
  deck.style.setProperty("--s", s);
}
window.addEventListener("resize", fit);

function openOv(){ ov.classList.add("on"); }
function closeOv(){ ov.classList.remove("on"); }

document.getElementById("bNext").addEventListener("click", next);
document.getElementById("bPrev").addEventListener("click", prev);
document.getElementById("bOv").addEventListener("click", function(){ ov.classList.contains("on") ? closeOv() : openOv(); });
document.getElementById("bOvX").addEventListener("click", closeOv);
document.getElementById("bPrint").addEventListener("click", function(){ window.print(); });
document.getElementById("bFull").addEventListener("click", function(){
  if (document.fullscreenElement) { document.exitFullscreen(); }
  else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
});
bLang.addEventListener("click", function(){
  L = (L === "ar") ? "en" : "ar";
  store("de.lang", L);
  build();
});

document.addEventListener("keydown", function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key;
  if (k === "Escape") { ov.classList.contains("on") ? closeOv() : openOv(); e.preventDefault(); return; }
  if (k === "o" || k === "O") { ov.classList.contains("on") ? closeOv() : openOv(); return; }
  if (k === "l" || k === "L") { bLang.click(); return; }
  if (k === "f" || k === "F") { document.getElementById("bFull").click(); return; }
  var fwd = (document.documentElement.dir === "rtl") ? "ArrowLeft" : "ArrowRight";
  var back = (document.documentElement.dir === "rtl") ? "ArrowRight" : "ArrowLeft";
  if (k === fwd || k === "ArrowDown" || k === "PageDown" || k === " ") { next(); e.preventDefault(); return; }
  if (k === back || k === "ArrowUp" || k === "PageUp") { prev(); e.preventDefault(); return; }
  if (k === "Home") { go(0); e.preventDefault(); return; }
  if (k === "End") { go(N-1); e.preventDefault(); return; }
  if (/^[1-9]$/.test(k)) { go(+k - 1); return; }
  if (k === "0") { go(9); return; }
});

/* touch */
var tx = null, ty = null;
stage.addEventListener("touchstart", function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
stage.addEventListener("touchend", function(e){
  if (tx === null) return;
  var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 58 && Math.abs(dx) > Math.abs(dy)) {
    var rtl = document.documentElement.dir === "rtl";
    (dx < 0) ? (rtl ? prev() : next()) : (rtl ? next() : prev());
  }
  tx = ty = null;
}, {passive:true});

/* controls hide after a quiet moment */
var idleT=null;
function wake(){ document.body.classList.remove("idle"); clearTimeout(idleT);
  idleT=setTimeout(function(){ if(!ov.classList.contains("on")) document.body.classList.add("idle"); }, 2400); }
["mousemove","mousedown","touchstart","keydown"].forEach(function(ev){ document.addEventListener(ev, wake, {passive:true}); });

/* deep links: #1 … #10 */
window.addEventListener("hashchange", function(){
  var h=parseInt((location.hash||"").replace("#",""),10);
  if (h>=1 && h<=N && h-1!==i) show(h-1, true);
});

/* boot */
var saved = recall("de.lang"); if (saved === "ar" || saved === "en") L = saved;
var h0 = parseInt((location.hash||"").replace("#",""), 10);
if (h0 >= 1 && h0 <= SLIDES.length) i = h0 - 1;
build();
fit();
wake();
})();
</script>
<style>@page{size:1920px 1080px;margin:0}</style>
</body>
